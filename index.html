    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Fix bug: di Chrome Android, 100dvh dihitung salah saat first paint
      // (sebelum address bar "settle"), jadi konten (termasuk bottom nav)
      // ke-render di luar area yang kelihatan. Kita hitung tinggi asli lewat
      // JS dan simpan sebagai CSS variable, lalu update tiap resize.
      function setAppHeight() {
        document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px')
      }
      setAppHeight()
      window.addEventListener('resize', setAppHeight)
      window.addEventListener('orientationchange', setAppHeight)
    </script>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
