<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatKu</title>
    <link rel="icon" href="data:,">
    <style>
      :root {
        --accent: #5b5bd6;
        --accent-hover: #4b4bc4;
        --accent-soft: #eef0ff;
        --bg: #f7f7fb;
        --surface: #ffffff;
        --border: #e6e6ef;
        --text: #1a1a2e;
        --text-muted: #7a7a90;
        --radius: 14px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        color: var(--text);
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background: var(--bg);
      }

      #root {
        height: 100%;
        overflow: hidden;
      }

      /* ---------- Login ---------- */
      .login-screen {
        height: 100vh;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(150deg, #5b5bd6 0%, #8b7ff0 100%);
      }

      .login-card {
        background: var(--surface);
        border-radius: 20px;
        padding: 44px 36px;
        width: 100%;
        max-width: 340px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(30, 20, 90, 0.25);
      }

      .login-logo {
        font-size: 40px;
        margin-bottom: 10px;
      }

      .login-card h1 {
        color: var(--text);
        margin-bottom: 6px;
        font-size: 22px;
        letter-spacing: -0.02em;
      }

      .login-card p {
        color: var(--text-muted);
        font-size: 14px;
        margin-bottom: 22px;
      }

      .login-card input {
        width: 100%;
        padding: 12px 14px;
        border: 1.5px solid var(--border);
        border-radius: 10px;
        font-size: 15px;
        margin-bottom: 12px;
        background: var(--bg);
        transition: border-color 0.15s;
      }

      .login-card input:focus {
        outline: none;
        border-color: var(--accent);
        background: var(--surface);
      }

      .login-card button {
        width: 100%;
        padding: 12px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
      }

      .login-card button:hover:not(:disabled) {
        background: var(--accent-hover);
      }

      .login-card button:disabled {
        opacity: 0.6;
        cursor: default;
      }

      .login-error {
        color: #e2445c;
        font-size: 13px;
        margin-top: 10px;
      }

      /* ---------- Shell ---------- */
      .app-shell {
        height: 100%;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .navbar {
        height: 56px;
        background: var(--surface);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 20px;
        flex-shrink: 0;
        border-bottom: 1px solid var(--border);
      }

      .navbar-brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: 18px;
        letter-spacing: -0.02em;
      }

      .navbar-logo {
        font-size: 20px;
      }

      .app-body {
        flex: 1;
        display: flex;
        overflow: hidden;
        position: relative;
      }

      /* ---------- Sidebar ---------- */
      .sidebar {
        width: 360px;
        flex-shrink: 0;
        background: var(--surface);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .sidebar-search {
        padding: 14px 14px 10px;
      }

      .sidebar-search input {
        width: 100%;
        padding: 10px 16px;
        background: var(--bg);
        border: 1.5px solid transparent;
        border-radius: 10px;
        font-size: 14px;
        transition: border-color 0.15s;
      }

      .sidebar-search input:focus {
        outline: none;
        border-color: var(--accent);
        background: var(--surface);
      }

      .search-results {
        border-bottom: 1px solid var(--border);
        max-height: 240px;
        overflow-y: auto;
      }

      .search-hint {
        padding: 12px 16px;
        font-size: 13px;
        color: var(--text-muted);
      }

      .search-result-item,
      .conversation-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        cursor: pointer;
        border-radius: 10px;
        margin: 0 6px;
      }

      .search-result-item:hover,
      .conversation-item:hover {
        background: var(--bg);
      }

      .conversation-item.active {
        background: var(--accent-soft);
      }

      .avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        flex-shrink: 0;
      }

      .conversation-list {
        flex: 1;
        overflow-y: auto;
        padding: 4px 0 12px;
      }

      .conversation-info {
        min-width: 0;
        flex: 1;
      }

      .conversation-name {
        font-size: 15px;
        font-weight: 600;
      }

      .conversation-preview {
        font-size: 13px;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .empty-list {
        padding: 30px 20px;
        text-align: center;
        color: var(--text-muted);
        font-size: 14px;
        line-height: 1.6;
      }

      /* ---------- Chat window ---------- */
      .chat-window {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        min-width: 0;
      }

      .chat-window.empty {
        align-items: center;
        justify-content: center;
      }

      .empty-state {
        text-align: center;
        color: var(--text-muted);
      }

      .empty-icon {
        font-size: 48px;
        margin-bottom: 10px;
      }

      .chat-header {
        height: 64px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 20px;
        flex-shrink: 0;
      }

      .chat-header-name {
        font-weight: 600;
        font-size: 16px;
      }

      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px 6% 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .bubble-row {
        display: flex;
      }

      .bubble-row.mine {
        justify-content: flex-end;
      }

      .bubble-row.theirs {
        justify-content: flex-start;
      }

      .bubble {
        max-width: 65%;
        padding: 9px 13px;
        border-radius: 16px;
        font-size: 14.5px;
        line-height: 1.4;
        box-shadow: 0 1px 2px rgba(20, 20, 50, 0.06);
      }

      .bubble.mine {
        background: var(--accent);
        color: #fff;
        border-bottom-right-radius: 4px;
      }

      .bubble.theirs {
        background: var(--surface);
        border-bottom-left-radius: 4px;
      }

      .bubble-text {
        white-space: pre-wrap;
        word-break: break-word;
      }

      .bubble-time {
        font-size: 11px;
        text-align: right;
        margin-top: 3px;
        color: var(--text-muted);
      }

      .bubble.mine .bubble-time {
        color: rgba(255, 255, 255, 0.75);
      }

      .chat-input {
        display: flex;
        gap: 10px;
        padding: 14px 16px;
        background: var(--surface);
        border-top: 1px solid var(--border);
        flex-shrink: 0;
      }

      .chat-input input {
        flex: 1;
        padding: 11px 16px;
        border: 1.5px solid var(--border);
        border-radius: 20px;
        font-size: 14.5px;
        background: var(--bg);
      }

      .chat-input input:focus {
        outline: none;
        border-color: var(--accent);
        background: var(--surface);
      }

      .chat-input button {
        background: var(--accent);
        color: #fff;
        border: none;
        padding: 0 22px;
        border-radius: 20px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
      }

      .chat-input button:hover {
        background: var(--accent-hover);
      }

      /* ---------- Bottom nav ---------- */
      .bottom-nav {
        display: flex;
        flex-shrink: 0;
        background: var(--surface);
        border-top: 1px solid var(--border);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }

      .bottom-nav-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        background: none;
        border: none;
        padding: 8px 4px 10px;
        cursor: pointer;
        color: var(--text-muted);
        transition: color 0.15s;
      }

      .bottom-nav-item:hover {
        color: var(--text);
      }

      .bottom-nav-item.active {
        color: var(--accent);
      }

      .bottom-nav-icon {
        font-size: 21px;
        line-height: 1;
      }

      .bottom-nav-label {
        font-size: 11px;
        font-weight: 600;
      }

      /* ---------- Placeholder tabs (Update / Komunitas / Panggilan) ---------- */
      .placeholder-screen {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        text-align: center;
        color: var(--text-muted);
        padding: 20px;
      }

      .placeholder-icon {
        font-size: 44px;
        margin-bottom: 6px;
      }

      .placeholder-screen h2 {
        color: var(--text);
        font-size: 18px;
      }

      /* ---------- Settings tab ---------- */
      .settings-screen {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 20px;
      }

      .settings-avatar {
        width: 76px;
        height: 76px;
        border-radius: 50%;
        background: var(--accent-soft);
        color: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 28px;
      }

      .settings-username {
        font-size: 17px;
        font-weight: 600;
      }

      .settings-logout {
        background: var(--bg);
        border: 1px solid var(--border);
        color: #e2445c;
        padding: 10px 26px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: background 0.15s;
      }

      .settings-logout:hover {
        background: var(--border);
      }

      /* ---------- Mobile ---------- */
      .mobile-back {
        display: none;
      }

      @media (max-width: 768px) {
        .sidebar {
          width: 100%;
        }

        .chat-window {
          display: none;
        }

        .app-body.has-conversation .sidebar {
          display: none;
        }

        .app-body.has-conversation .chat-window {
          display: flex;
          width: 100%;
        }

        .mobile-back {
          display: block;
          position: absolute;
          top: 10px;
          left: 10px;
          z-index: 5;
          background: var(--surface);
          border: 1px solid var(--border);
          padding: 7px 12px;
          border-radius: 8px;
          font-size: 13px;
          cursor: pointer;
          box-shadow: 0 2px 6px rgba(20, 20, 50, 0.08);
        }

        .bottom-nav.bottom-nav-hide-mobile {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
